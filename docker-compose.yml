services:

  validator_server:
    build:
      context: .
      dockerfile: ./docker/validator/Dockerfile
    image: validator_server
    container_name: validator_server
    command: python model_servers/validator.py
    environment:
      SERVER_PORT: 5000
      OPEN_ROUTER_API_KEY: ${OPEN_ROUTER_API_KEY}
      MAX_TRIES: 3
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - solidity-audit

  validator:
    build:
      context: .
      dockerfile: ./docker/neuron/Dockerfile
    image: validator
    container_name: validator
    environment:
      MNEMONIC_HOTKEY: ${VALIDATOR_HOTKEY_MNEMONIC}
      NETWORK_UID: ${NETWORK_UID}
      CHAIN_ENDPOINT: ${CHAIN_ENDPOINT}
      VALIDATOR_TIME: ${VALIDATOR_TIME}
      BT_AXON_PORT: 49999
      MODEL_SERVER: 'http://validator_server:5000'
    restart: unless-stopped
    volumes:
      - /root/sn92_khaihotkey_vali:/app
    networks:
      - solidity-audit

networks:
  solidity-audit:


